<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OB-091 forest descent - before / after (top-down)</title>
<style>
  body { background: #0b0d10; color: #c9d1d9; font: 13px/1.4 Consolas, monospace; margin: 16px; }
  h1 { font-size: 16px; color: #e6edf3; margin: 0 0 6px; }
  h2 { font-size: 13px; color: #9fb3c8; margin: 14px 0 4px; }
  canvas { display: block; background: #12161b; border: 1px solid #222a33; }
  .legend span { display: inline-block; margin-right: 14px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  table { border-collapse: collapse; margin-top: 6px; } td, th { border: 1px solid #222a33; padding: 2px 10px; text-align: right; } th { color: #9fb3c8; }
  #msg { color: #ff7b72; }
  label { margin-left: 12px; }
</style>
<script src="ob091-forest.data.js"></script>
</head>
<body>
<h1>OB-091 - tower hill -> river: designed forest descent (top-down, north up, x 1030..1500)</h1>
<div id="msg"></div>
<div class="legend">
  <span><i class="dot" style="background:#3fb950"></i>tree</span><span><i class="dot" style="background:#a0785a"></i>dead tree</span>
  <span><i class="dot" style="background:#8b949e"></i>rock</span><span><i class="dot" style="background:#59606a"></i>pebble</span>
  <span><i class="dot" style="background:#1f6f43"></i>bush / fern</span><span><i class="dot" style="background:#f778ba"></i>flower</span>
  <span><i class="dot" style="background:#d29922"></i>log</span><span><i class="dot" style="background:#e5534b"></i>mushroom</span>
  <span><i class="dot" style="background:#c2a878"></i>path stones</span><span><i class="dot" style="border:1px solid #fff"></i>added (after)</span>
  <label><input type="checkbox" id="grass"> grass tufts</label><label><input type="checkbox" id="spots" checked> spots + corridor</label>
</div>
<h2>BEFORE</h2><canvas id="cb"></canvas>
<h2>AFTER</h2><canvas id="ca"></canvas>
<h2>Counts on the stretch (scatter placements roadS/L/W/N/F/G, mdw, ob91-)</h2><table id="tb"></table>
<script>
const D = window.OB091;
const X0 = 1030, X1 = 1500, Y0 = 985, Y1 = 1115, S = Math.min(3.2, (window.innerWidth - 40) / (X1 - X0));
const COL = { tree: '#3fb950', deadtree: '#a0785a', rock: '#8b949e', pebble: '#59606a', bush: '#1f6f43', fern: '#2a8a6a', flower: '#f778ba', log: '#d29922', mushroom: '#e5534b', rockpath: '#c2a878', grass: '#2b3a2b', other: '#b07040' };
const SIZE = { tree: 2.4, deadtree: 2.0, rock: 2.2, pebble: 1.3, bush: 1.6, fern: 1.4, flower: 1.2, log: 2.4, mushroom: 1.1, rockpath: 1.5, grass: 0.8, other: 1.0 };
function draw(id, rows, after) {
  const c = document.getElementById(id), g = c.getContext('2d');
  c.width = (X1 - X0) * S; c.height = (Y1 - Y0) * S; g.clearRect(0, 0, c.width, c.height);
  const P = (x, y) => [(x - X0) * S, (y - Y0) * S];
  const showSpots = document.getElementById('spots').checked;
  // walked lines + 4 m corridor
  for (const L of D.walks) {
    g.lineCap = 'round'; g.lineJoin = 'round';
    if (showSpots) { g.strokeStyle = 'rgba(240,200,80,0.10)'; g.lineWidth = 2 * D.clear * S; g.beginPath(); L.forEach(([x, y], i) => { const [px, py] = P(x, y); i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.stroke(); }
    g.strokeStyle = 'rgba(240,200,80,0.7)'; g.lineWidth = 1; g.beginPath(); L.forEach(([x, y], i) => { const [px, py] = P(x, y); i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.stroke();
  }
  if (showSpots) {
    for (const k of D.keepOut) { const [px, py] = P(k.x, k.y); g.strokeStyle = 'rgba(255,90,90,0.35)'; g.setLineDash([3, 3]); g.beginPath(); g.arc(px, py, k.r * S, 0, 7); g.stroke(); g.setLineDash([]); }
    const sp = D.spots, lab = (p, t, r) => { if (!p) return; const [px, py] = P(p.x, p.y); g.strokeStyle = '#79c0ff'; g.beginPath(); g.arc(px, py, r * S, 0, 7); g.stroke(); g.fillStyle = '#79c0ff'; g.fillText(t, px + r * S + 3, py - 3); };
    lab(sp.glade, 'sunny glade', 8); lab(sp.log, 'fallen log', 3.5); lab(sp.outcrop, 'mossy outcrop', 6);
    if (sp.view) { const v = sp.view, a = Math.atan2(v.ty - v.y, v.tx - v.x), h = v.halfDeg * Math.PI / 180, [px, py] = P(v.x, v.y);
      g.fillStyle = 'rgba(121,192,255,0.08)'; g.beginPath(); g.moveTo(px, py); g.arc(px, py, v.len * S, a - h, a + h); g.closePath(); g.fill(); g.fillStyle = '#79c0ff'; g.fillText('view to the river', px + 4, py + 14); }
    for (const k of D.keepSpots) { const [px, py] = P(k.x, k.y); g.strokeStyle = 'rgba(200,200,200,0.25)'; g.beginPath(); g.arc(px, py, k.r * S, 0, 7); g.stroke(); }
    for (const [x, y] of D.caps) { const [px, py] = P(x, y); g.fillStyle = '#ff4040'; g.fillRect(px - 2, py - 2, 4, 4); }
  }
  const grass = document.getElementById('grass').checked;
  for (const [x, y, k, add] of rows) {
    if (k === 'grass' && !grass) continue;
    const [px, py] = P(x, y); g.fillStyle = COL[k] || '#888'; g.beginPath(); g.arc(px, py, (SIZE[k] || 1) * S * 0.6, 0, 7); g.fill();
    if (after && add) { g.strokeStyle = '#ffffff'; g.lineWidth = 1; g.stroke(); }
  }
  g.fillStyle = '#6e7681'; g.fillText('tower ->', (1478 - X0) * S - 40, (1020 - Y0) * S); g.fillText('<- ford / river', 4, (1060 - Y0) * S);
}
function render() {
  if (!D) { document.getElementById('msg').textContent = 'No data: run  node tools/ob091-forest.mjs  from the repo root (it writes design/preview/ob091-forest.data.js).'; return; }
  draw('cb', D.before, false); draw('ca', D.after, true);
  const k = Object.keys(D.counts.before), pct = (a, b) => (b ? Math.round(100 * (a - b) / b) + ' %' : '-');
  document.getElementById('tb').innerHTML = '<tr><th></th>' + k.map((x) => '<th>' + x + '</th>').join('') + '</tr>' +
    '<tr><th>before</th>' + k.map((x) => '<td>' + D.counts.before[x] + '</td>').join('') + '</tr>' +
    '<tr><th>after</th>' + k.map((x) => '<td>' + D.counts.after[x] + '</td>').join('') + '</tr>' +
    '<tr><th>change</th>' + k.map((x) => '<td>' + pct(D.counts.after[x], D.counts.before[x]) + '</td>').join('') + '</tr>' +
    '<tr><th>removed by rule</th><td colspan="' + k.length + '" style="text-align:left">' + Object.entries(D.removed).map(([a, b]) => a + ' ' + b).join(', ') + '</td></tr>';
}
document.getElementById('grass').onchange = render; document.getElementById('spots').onchange = render;
render();
</script>
</body>
</html>
