<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Quest - Editor</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font: 13px "Courier New", monospace;
      color: #cfead0;
    }
    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }
    #viewport {
      position: relative;
      flex: 1 1 auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #screen {
      display: block;
      image-rendering: pixelated;
      outline: none;
    }
    #panel {
      flex: 0 0 260px;
      background: #0c120c;
      border-left: 1px solid #2a3a2a;
      padding: 8px;
      overflow-y: auto;
      box-sizing: border-box;
    }
    #panel h1 {
      font-size: 13px;
      margin: 0 0 8px 0;
      color: #9be89b;
    }
    #panel section {
      margin-bottom: 12px;
      border-bottom: 1px solid #1c2a1c;
      padding-bottom: 8px;
    }
    #panel label {
      display: block;
      margin: 4px 0;
    }
    #status {
      white-space: pre-wrap;
      color: #7CFC7C;
    }
    #gate-message {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2em;
      background: #000;
      color: #e8e2d0;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewport">
      <canvas id="screen" tabindex="0"></canvas>
    </div>
    <div id="panel">
      <h1>ASCII Quest - Editor</h1>
      <section>
        <label><input type="checkbox" id="animate-toggle" /> Animate</label>
        <label>Speed <input type="number" id="speed-input" min="0.5" max="200" step="0.5" value="6" /> m/s</label>
      </section>
      <section>
        <div id="outliner">(outliner - US-032+)</div>
      </section>
      <section>
        <div id="status"></div>
      </section>
    </div>
  </div>
  <div id="gate-message"></div>

  <!-- Same design/ script list as game/index.html (24.3) - classic scripts so
       window.ASSETS.palette/detailPass/models/uiStyle are ready before
       js/main.js's module runs. The level/world content (tower, world_m1)
       now comes from content/*.json via loadContentPack, not a script tag
       (US-027b) - overworld_far stays a script (it's a code recipe, D-007). -->
  <script src="../../design/palette.js"></script>
  <script src="../../design/detail-pass.js"></script>
  <script src="../../design/models/title.js"></script>
  <script src="../../design/models/lantern.js"></script>
  <script src="../../design/models/brazier.js"></script>
  <script src="../../design/models/lever.js"></script>
  <script src="../../design/models/boulder.js"></script>
  <script src="../../design/models/rubble.js"></script>
  <script src="../../design/models/wreckage.js"></script>
  <script src="../../design/models/relay.js"></script>
  <script src="../../design/models/voxel_props.js"></script>
  <script src="../../design/models/voxel_tower.js"></script>
  <script src="../../design/models/far_tower.js"></script>
  <script src="../../design/models/ferrum_lights.js"></script>
  <script src="../../design/levels/overworld_far.js"></script>

  <script type="module" src="main.js"></script>
</body>
</html>
