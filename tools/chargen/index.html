<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Character Generator</title>
<!-- Serve from the repo root: python -m http.server <port>, open /tools/chargen/index.html -->
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  :root { color-scheme: dark; --bg: #16191f; --panel: #1e232b; --line: #2f3641; --fg: #dde3ec; --dim: #8a94a4; --acc: #e0a64a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  #side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 12px 16px; }
  #view { position: relative; min-width: 0; min-height: 0; }
  #view canvas { display: block; }
  h2 { margin: 14px 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .row > span { width: 64px; flex: none; color: var(--dim); text-transform: capitalize; }
  .row select, .row input[type=text] { flex: 1; min-width: 0; }
  .row input[type=range] { flex: 1; }
  .group button { margin: 2px 4px 2px 0; }
  select, input[type=text], button { background: #272d37; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; } button:hover:not(:disabled) { border-color: var(--acc); } button:disabled { opacity: .4; cursor: default; }
  .status { margin-top: 12px; color: var(--dim); min-height: 1.4em; }
  @media (max-width: 700px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 50vh; } #side { max-height: 50vh; } }
</style>
</head>
<body>
<div id="app">
  <div id="side"></div>
  <div id="view"></div>
</div>
<script type="module">
import '../../design/palette.js';
import '../../design/detail-pass.js';
import { createChargen } from './core.js';
import { createViewer } from './viewer.js';
import { mountUi, debounce } from './ui.js';

const P = window.ASSETS.palette;
const rgbOf = (key) => {
  const m = P.materials[key];
  if (!m || !P.rgb[m.base]) throw new Error(`palette: no colour for material "${key}"`);
  return P.rgb[m.base];
};
const kit = await (await fetch('../../content/chargen/human.charkit.json')).json();
const chargen = createChargen({ kit, rgbOf });
const viewer = createViewer(document.getElementById('view'));

let lastGlb = null, seq = 0;
async function rebuild() { // core.build() -> exportGlb() -> GLTFLoader.parse -> SkinnedMesh + mixer
  const my = ++seq;
  try {
    const glb = chargen.exportGlb();
    const names = await viewer.load(glb);
    if (my !== seq) return;
    lastGlb = glb; ui.setClips(names); ui.status('');
  } catch (e) { ui.status('build failed: ' + (e.message || e)); console.error(e); }
}
const rebuildSoon = debounce(rebuild, 150);

const ui = mountUi(document.getElementById('side'), {
  kit, chargen,
  cb: {
    onRecipe: rebuildSoon,
    onSeed: (s) => { ui.setRecipe(chargen.random(s)); rebuildSoon(); },
    onClip: (n) => viewer.setClip(n),
    onPlay: (p) => viewer.setPlaying(p),
    onScrub: (t) => viewer.setScrub(t),
    onTurntable: (on) => viewer.setTurntable(on),
  },
});
viewer.onTime((t) => ui.setTime(t));
await rebuild();
// test hook for tools/verify-chargen.mjs
window.__chargen = { chargen, viewer, get glb() { return lastGlb; }, rebuildNow: rebuild };
</script>
</body>
</html>
