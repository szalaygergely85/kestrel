<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Quest</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #screen {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      image-rendering: pixelated;
    }
    #debug-overlay {
      user-select: none;
    }
    #file-protocol-notice {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2em;
      background: #000;
      color: #e8e2d0;
      font: 16px "Courier New", monospace;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>

  <script>
    // ES modules (js/main.js) refuse to load over file:// (CORS). Catch that
    // case early with a friendly one-line message instead of a silent blank
    // canvas + a console error nobody sees.
    if (location.protocol === 'file:') {
      document.write(
        '<div id="file-protocol-notice">Run a static server, e.g. <code>python -m http.server 8000</code>' +
        ' from the project root, then open <code>http://localhost:8000/game/index.html</code></div>'
      );
    }
  </script>

  <!-- Designer's palette/glyph-ramp/material data (US-002). Loaded as a
       classic script (works even from file://, and runs before the deferred
       module below) so window.ASSETS.palette is always ready before
       js/render/palette.js's getPalette() is first called. -->
  <script src="../design/palette.js"></script>
  <!-- US-028: v2 detail-pass proposal (G-buffer shading materials, sets,
       edge rules) - loaded right after palette.js, same classic-script
       reasoning; AssetRegistry.fromGlobals reads window.ASSETS.detailPass. -->
  <script src="../design/detail-pass.js"></script>
  <!-- ASSETS.uiStyle (US-005 pause overlay text/plate, US-015/017 hints/
       title/end text later) + the title/subtitle models - same
       classic-script/load-order reasoning as palette.js above. -->
  <script src="../design/models/title.js"></script>
  <!-- US-030c: billboard models the sprite pass tests with (`?sprite=1`,
       design/README.md section 4) - same classic-script loading. -->
  <script src="../design/models/lantern.js"></script>
  <script src="../design/models/brazier.js"></script>
  <!-- US-011: every remaining tower prop model (7.5 item 1 - `World.load`'s
       prop spawn throws if a `props[].model` isn't registered, so every
       model design/levels/tower.js references must load here). `brazier.js`
       above stays for its `beaconBowl`/`beaconFire` legacy keys (7.5 intro:
       "old model keys stay as their own registry entries"); `wreckage.js`
       and `relay.js` are the D-011 reskin models (burner, canvasHeap,
       gondola, rigging, strut, rope, envelopeDrape, envelopeHeap, relay). -->
  <script src="../design/models/lever.js"></script>
  <script src="../design/models/boulder.js"></script>
  <script src="../design/models/rubble.js"></script>
  <script src="../design/models/wreckage.js"></script>
  <script src="../design/models/relay.js"></script>
  <!-- US-040 step 4/5 + US-041a: voxel prop models (lever, lantern) - loaded
       after palette.js/detail-pass.js (materials merged, architecture.md
       15.2) and after lever.js/lantern.js (attach() needs `ASSETS.models.
       lever`/`lantern` to already exist), same classic-script loading. -->
  <script src="../design/models/voxel_props.js"></script>
  <!-- US-056: the remaining solid tower props (boulder, rubble, canvas heap,
       gondola, strut, envelope heap, relay) as voxel models - loaded after
       voxel_props.js (adds to ASSETS.voxelMaterials, doesn't replace it) and
       after boulder.js/rubble.js/wreckage.js/relay.js (attachTower() needs
       those ASSETS.models entries to already exist), same classic-script
       loading. -->
  <script src="../design/models/voxel_tower.js"></script>
  <!-- US-026a-S6: the waystone voxel model (world entity `endMarker`,
       content/worlds/world_m1.world.json) - loaded right after
       voxel_tower.js, same classic-script convention (materials merged
       append-only onto ASSETS.voxelMaterials). -->
  <script src="../design/models/voxel_world.js"></script>
  <!-- US-016 D-011 addendum: the far signal tower + Ferrum's horizon lights
       (world_m1.js's `farTower` entity + `horizon[]` entry reference these). -->
  <script src="../design/models/far_tower.js"></script>
  <script src="../design/models/ferrum_lights.js"></script>
  <!-- US-025: overworld_far is a terrain RECIPE (code, generative), not
       content - stays a classic script (D-007). test_room/tower/world_m1
       moved to content/*.json by US-027b (architecture.md 21.9) - js/main.js
       now loads them via loadContentPack + AssetRegistry.fromJSON instead of
       a classic <script> tag; see design/README.md. -->
  <script src="../design/levels/overworld_far.js"></script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
