<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Quest</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #screen {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      image-rendering: pixelated;
    }
    #debug-overlay {
      user-select: none;
    }
    #file-protocol-notice {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2em;
      background: #000;
      color: #e8e2d0;
      font: 16px "Courier New", monospace;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>

  <script>
    // ES modules (js/main.js) refuse to load over file:// (CORS). Catch that
    // case early with a friendly one-line message instead of a silent blank
    // canvas + a console error nobody sees.
    if (location.protocol === 'file:') {
      document.write(
        '<div id="file-protocol-notice">Run a static server, e.g. <code>python -m http.server 8000</code>' +
        ' from the project root, then open <code>http://localhost:8000/game/index.html</code></div>'
      );
    }
  </script>

  <!-- Designer's palette/glyph-ramp/material data (US-002). Loaded as a
       classic script (works even from file://, and runs before the deferred
       module below) so window.ASSETS.palette is always ready before
       js/render/palette.js's getPalette() is first called. -->
  <script src="../design/palette.js"></script>
  <!-- US-091a (v1.34): item defs + inventory icons + loot sprites (ASSETS.items / ASSETS.lootSprites),
       classic script loaded right after palette.js (design/README.md section 13). -->
  <script src="../design/items.js"></script>
  <!-- US-053c: particle presets (flame/smoke/sparks/dust) - no load-order dependency on palette.js itself
       (toEmitterDef resolves palette.rgb at boot-wiring time, not at script-load time). -->
  <script src="../design/models/particles.js"></script>
  <!-- HANDS-01c: spell hand (voxelModels.spellHandL + viewModels.spellHand + spellFx); after particles.js, palette/detail-pass already loaded -->
  <script src="../design/models/spell.js"></script>
  <!-- HAND-WIRE-01: realistic hand + always-on fire (viewModels.hand, 26 variants); after palette/detail-pass/particles -->
  <script src="../design/models/hand.js"></script>
  <!-- US-028: v2 detail-pass proposal (G-buffer shading materials, sets,
       edge rules) - loaded right after palette.js, same classic-script
       reasoning; AssetRegistry.fromGlobals reads window.ASSETS.detailPass. -->
  <script src="../design/detail-pass.js"></script>
  <!-- US-055a2c (Q12 item 8): water look table (window.ASSETS.waterLooks), same classic-script load-order
       reasoning as palette.js/detail-pass.js above - resolved once via resolveWaterLooks (engine/index.js). -->
  <script src="../design/water-looks.js"></script>
  <script src="../design/waterfall.js"></script>
  <!-- ASSETS.uiStyle (US-005 pause overlay text/plate, US-015/017 hints/
       title/end text later) + the title/subtitle models - same
       classic-script/load-order reasoning as palette.js above. -->
  <script src="../design/models/title.js"></script>
  <script src="../design/models/compass_ui.js"></script> <!-- COMPASS-D1/02 (D-061): ASSETS.uiStyle.compass; after title.js -->
  <script src="../design/models/menu_ui.js"></script>
  <!-- US-091b: pack screen style (ASSETS.uiStyle.inventory); after title.js (assigns uiStyle) and items.js -->
  <script src="../design/models/inventory_ui.js"></script>
  <!-- READ-01 (v1.36): readable notes - the texts (ASSETS.notes), the paper
       read panel (uiStyle.note) and the levelPatch.towerNotes interactables.
       Loaded after detail-pass.js / models/title.js (notes.js only extends
       uiStyle); the note/notePinned prop models live in m3_props.js (6c). -->
  <script src="../design/models/notes.js"></script>
  <!-- US-030c: billboard models the sprite pass tests with (`?sprite=1`,
       design/README.md section 4) - same classic-script loading. -->
  <script src="../design/models/lantern.js"></script>
  <script src="../design/models/brazier.js"></script>
  <!-- US-011: every remaining tower prop model (7.5 item 1 - `World.load`'s
       prop spawn throws if a `props[].model` isn't registered, so every
       model design/levels/tower.js references must load here). `brazier.js`
       above stays for its `beaconBowl`/`beaconFire` legacy keys (7.5 intro:
       "old model keys stay as their own registry entries"); `wreckage.js`
       and `relay.js` are the D-011 reskin models (burner, canvasHeap,
       gondola, rigging, strut, rope, envelopeDrape, envelopeHeap, relay). -->
  <script src="../design/models/lever.js"></script>
  <script src="../design/models/boulder.js"></script>
  <script src="../design/models/rubble.js"></script>
  <script src="../design/models/wreckage.js"></script>
  <script src="../design/models/relay.js"></script>
  <!-- US-040 step 4/5 + US-041a: voxel prop models (lever, lantern) - loaded
       after palette.js/detail-pass.js (materials merged, architecture.md
       15.2) and after lever.js/lantern.js (attach() needs `ASSETS.models.
       lever`/`lantern` to already exist), same classic-script loading. -->
  <script src="../design/models/voxel_props.js"></script>
  <!-- US-056: the remaining solid tower props (boulder, rubble, canvas heap,
       gondola, strut, envelope heap, relay) as voxel models - loaded after
       voxel_props.js (adds to ASSETS.voxelMaterials, doesn't replace it) and
       after boulder.js/rubble.js/wreckage.js/relay.js (attachTower() needs
       those ASSETS.models entries to already exist), same classic-script
       loading. -->
  <script src="../design/models/voxel_tower.js"></script>
  <!-- US-026a-S6: the waystone voxel model (world entity `endMarker`,
       content/worlds/world_m1.world.json) - loaded right after
       voxel_tower.js, same classic-script convention (materials merged
       append-only onto ASSETS.voxelMaterials). -->
  <script src="../design/models/voxel_world.js"></script>
  <script src="../design/models/voxel_tower_crown.js"></script>
  <!-- US-078: the ruin-steel sword (pickup + held model + view-model clips); colours/materials merged in
       palette.js / detail-pass.js. Not placed in any level yet. -->
  <script src="../design/models/sword.js"></script>
  <!-- US-078d / US-080: M3 props (practice pell, HP/MP pickups, vitals HUD style); must load after title.js and sword.js. Colours/materials merged in palette.js / detail-pass.js. Not placed in any level yet. -->
  <script src="../design/models/m3_props.js"></script>
  <!-- US-079a: placeholder boarPlaceholder voxel model (architecture.md 29.1); uses only already-merged
       materials (leather, canvas_dark), no further palette.js/detail-pass.js merge needed. Placed via
       content/worlds/world_m1.world.json's boar1/boar2 entities. -->
  <script src="../design/models/voxel_beast.js"></script>
  <script src="../design/models/voxel_bear.js"></script> <!-- NPC-BEAR-01: ASSETS.models.bear + ASSETS.bearFx -->
  <script src="../design/models/voxel_wildlife.js"></script> <!-- WILD-06: ASSETS.models.rabbit/deer/deerBuck + ASSETS.wildlifeFx -->
  <!-- S8-A-06: treasure chests chestSmall / chestBig + ASSETS.chestFx (merged materials only; design/README.md 16). -->
  <script src="../design/models/chest.js"></script>
  <!-- S8-A-08: M1 props (waystone variants, lantern post, breach rubble, sword pedestal; merged materials only; design/README.md 18). -->
  <script src="../design/models/props_m1.js"></script>
  <!-- v1.46: quest marker questMark ('!') / questMarkTurnIn ('?', later) + ASSETS.questMarkFx (merged materials only; design/README.md 20). Not placed yet. -->
  <script src="../design/models/quest_mark.js"></script>
  <!-- US-016 D-011 addendum: the far signal tower + Ferrum's horizon lights
       (world_m1.js's `farTower` entity + `horizon[]` entry reference these). -->
  <script src="../design/models/far_tower.js"></script>
  <script src="../design/models/ferrum_lights.js"></script>
  <!-- PC-B QUEUE 13 item 6 (D-036 "Show it" forest/grassland shots): CC0 Voxel Pack props
       (pig/bunny/bush/grassPatch/campfire/tree/stump/toolPlate), split + imported via
       tools/vox-split.mjs + vox-import.mjs from design/vox-cc0/voxel-pack/Raws/*.vox. -->
  <script src="../design/models/vp_pack.js"></script>
  <!-- US-145 (PC-B QUEUE 13 item 7): StickyBizcuit voxel pack (THIRD_PARTY_NOTICES.md), 37 of 106
       objects/wall-ground/village models, imported via vox-split.mjs + vox-import.mjs. -->
  <script src="../design/models/sb_objects.js"></script>
  <script src="../design/models/forest_trees.js"></script>
  <script src="../design/models/ground_detail.js"></script>
  <script src="../design/models/sb_stonewall.js"></script>
  <script src="../design/models/sb_village.js"></script>
  <!-- Owner request 2026-09-27: OPTIONAL local third-party voxel pack in git-ignored design/local/ (licence unverified, never pushed; a 404 here is expected on other checkouts). Split by
       tools/vox-split.mjs), 31 models that fit today's voxel limits,
       auto-mapped to existing materials - loaded after palette.js/
       detail-pass.js (attach guard needs both), same classic-script
       convention as voxel_tower.js/voxel_world.js above. Not placed in any
       level/world yet - placeholder ids until the designer names them. -->
  <script src="../design/local/voxel_pack.js" onerror="this.remove()"></script>
  <!-- US-025: overworld_far is a terrain RECIPE (code, generative), not
       content - stays a classic script (D-007). test_room/tower/world_m1
       moved to content/*.json by US-027b (architecture.md 21.9) - js/main.js
       now loads them via loadContentPack + AssetRegistry.fromJSON instead of
       a classic <script> tag; see design/README.md. -->
  <script src="../design/levels/overworld_far.js"></script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
